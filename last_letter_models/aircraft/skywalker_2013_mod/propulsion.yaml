# Airframe Propulsion Parameters
# Motor types: 0 No motor, 1 Beard Engine, 2 Piston engine, 3 Electric Engine, 4 Controlled Omega
# Polynomial types: 0 1D, 1 2D, 2 cubic spline

nMotors: 1

motor1:
  name: thruster_0
  chanMotor: 2

  CGOffset: [-0.25, 0.0, -0.13] # location offset of the motor mount relative to CG
  mountOrientation: [0.0, -0.08, 0.0] # Euler rotations from body axes to propeller normal plane. Gimbal rotation axis should be in z-axis.
  inertial:
    mass: 0.1
  chanGimbal: -1
  gimbalAngle_max: 0.0

  rotationDir: 1.0

  motorType: 4
  omega_max: 1050
  j_max: 0.7630
  prop_diam: 0.28
  thrust_poly:
    polyType: 0
    polyNo: 2
    coeffs: [0.1133, -0.0740, -0.1849]
  power_poly:
    polyType: 0
    polyNo: 2
    coeffs: [0.0440, 0.0059, -0.0732]
