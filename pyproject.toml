[project]
name = "last-letter"
version = "2.103.0"
description = "Software libraries for UAV simulation"
readme = "README.md"
authors = [
    { name = "George Zogopoulos", email = "tailwhipx4@gmail.com" }
]
requires-python = ">=3.10,<3.15"
dependencies = [
    "matplotlib>=3.10.3",
    "mcap>=1.2.0",
    "numpy>=2.2.6",
    "pandas>=2.2.0",
    "pybind11>=2.13.6",
    "pydantic>=2.11.7",
    "pyyaml>=6.0.2",
    "scipy>=1.15.3",
]

[project.scripts]
# Script to install the aircraft models to the user home, where they can be
# modified.
last-letter-install-models = "last_letter.paths:main"

[project.urls]
Homepage = "https://github.com/Georacer/last_letter"
Repository = "https://github.com/Georacer/last_letter"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["lib/src/last_letter"]
# Keep in sync with cmake_minimum_required in CMakeLists.txt, so the wheel build
# fetches a suitable cmake when the system one is older.
cmake.version = ">=3.28"

# The package build must produce the pybind11 extension; the CMake option that
# gates it defaults OFF (so a bare `cmake` build is C++-only), so turn it on here.
[tool.scikit-build.cmake.define]
LAST_LETTER_BUILD_PYTHON = "ON"

[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13.6"]
build-backend = "scikit_build_core.build"

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
]
